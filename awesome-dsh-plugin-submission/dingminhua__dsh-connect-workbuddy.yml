name: dingminhua/dsh-connect-workbuddy
category: model
icon: https://raw.githubusercontent.com/dingminhua/dsh-connect-workbuddy/main/icons/dsh-connect-workbuddy-128.png
description:
  en: Connects locally signed-in WorkBuddy models, CN and international alike, to DSH, reading each model's credit multiplier from the upstream catalog on every refresh, with per-model image input toggles, a per-model default reasoning level, account switching backed by an auto-failing-over pool, manual daily check-in, and read-only credit overviews shown as compact pills on the card and in the composer.
  zh: 在 DSH 中使用 WorkBuddy 国内版和国际版模型，支持账号切换、自动轮换、积分查询、每日签到和模型设置。
